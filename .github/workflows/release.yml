name: release

# Push a tag like v0.1.0 to build binaries for every platform and publish
# them, with checksums, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="tokencat-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p dist stage
          cp README.md LICENSE stage/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$bin/tokencat.exe" stage/
            (cd stage && 7z a -tzip "../dist/$name.zip" .)
          else
            cp "$bin/tokencat" stage/
            tar -czf "dist/$name.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in tokencat-*; do sha256sum "$f" > "$f.sha256"; done
          sha256sum tokencat-*.tar.gz tokencat-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
