# Link the MSVC C runtime statically so tokencat.exe is a single file with no
# Visual C++ redistributable dependency. (musl builds are static by default.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
